<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>BeeKeeper</title>

<meta name="theme-color" content="#eef0f4">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&family=Silkscreen:wght@400;700&family=VT323&family=Press+Start+2P&family=DotGothic16&family=Tiny5&family=Jersey+10&display=swap" rel="stylesheet">
<style>
  :root { --bg: #eef0f4; --card: #ffffff; --ink: #1c1d22; --muted: #5d6170; --line: #d9dce3; --accent: #7c5cff; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 14px/1.4 -apple-system, "SF Pro Text", "Segoe UI", sans-serif; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; cursor: grab; image-rendering: pixelated; }
  canvas.dragging { cursor: grabbing; }
  .hud { position: fixed; left: 16px; top: 16px; display: flex; gap: 8px; align-items: center; z-index: 3; }   /* above the side list, so the Rooms menu is never covered */
  select { height: 36px; padding: 0 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--ink); font: inherit; font-weight: 600; }
  button, .chip { height: 36px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--ink); font: inherit; font-weight: 600; cursor: pointer; box-shadow: 0 1px 2px rgba(0,0,0,.05); }
  button:hover { border-color: var(--accent); color: var(--accent); }
  button.on { background: #efeaff; border-color: #c9bcff; color: #4b2fd6; }
  .chip { display: flex; align-items: center; color: var(--muted); font-weight: 500; cursor: default; }
  .side { position: fixed; right: 16px; top: 16px; width: 250px; display: flex; flex-direction: column; gap: 6px; z-index: 2; max-height: calc(100vh - 32px); overflow: auto; }
  .side .head { font-size: 14px; color: var(--muted); font-weight: 600; padding: 4px 4px 0; }
  .side button { height: auto; padding: 8px 12px; text-align: left; font-weight: 500; line-height: 1.3; }
  .side button { display: flex; gap: 10px; align-items: center; }
  .side .thumb { width: 64px; height: 58px; object-fit: contain; image-rendering: pixelated; flex: none; background: #f4f5f8; border-radius: 6px; }
  .side .txt { min-width: 0; }
  .side button b { display: block; font-weight: 700; }
  .side button small { color: var(--muted); }
  .side .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
  .pick { position: relative; }
  .pick .menu { position: absolute; left: 0; top: 42px; min-width: 240px; max-height: calc(100vh - 80px); overflow: auto; background: var(--card); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.12); padding: 4px; }
  .pick .menu button { display: flex; align-items: center; gap: 8px; width: 100%; height: 30px; padding: 0 10px; border: 0; box-shadow: none; border-radius: 6px; font-weight: 500; text-align: left; white-space: nowrap; }
  .pick .menu button:hover, .pick .menu button.on { background: #efeaff; color: #4b2fd6; }
  .pick .menu i { width: 9px; height: 9px; flex: none; }
  .pick .menu i.live { background: #22c55e; }
  #zoomMenu { min-width: 170px; }
  .pick .menu kbd { margin-left: auto; font: inherit; color: var(--muted); }
  .pick .menu hr { border: 0; border-top: 1px solid var(--line); margin: 4px 2px; }
  .states { display: flex; flex-direction: column; gap: 6px; }
  .states button { height: 34px; padding: 0 12px; font-weight: 500; text-align: left; }
  .help { position: fixed; left: 16px; bottom: 14px; color: var(--muted); font-size: 12px; }
  .legend { position: fixed; left: 16px; bottom: 40px; display: flex; gap: 14px; font-size: 12px; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; }
  .legend span { display: flex; align-items: center; gap: 6px; }
  .legend i { width: 9px; height: 9px; display: inline-block; }
  /* the card: same pixel look as the bubbles and the Agents tab (the author, 2026-11-02): dark 3px outline with cut corners, Silkscreen titles */
  .card { position: fixed; left: 16px; top: 64px; width: 360px; max-width: calc(100vw - 32px); max-height: calc(100vh - 128px); overflow: auto; z-index: 3; background: #fff; border: 3px solid #2a2050; border-radius: 0; clip-path: polygon(3px 0, calc(100% - 3px) 0, calc(100% - 3px) 3px, 100% 3px, 100% calc(100% - 3px), calc(100% - 3px) calc(100% - 3px), calc(100% - 3px) 100%, 3px 100%, 3px calc(100% - 3px), 0 calc(100% - 3px), 0 3px, 3px 3px); box-shadow: inset -3px -3px 0 #e6e3f2; font: 400 16px/1.35 "Pixelify Sans", sans-serif; }
  .card .top { display: flex; gap: 14px; padding: 16px 48px 16px 16px; background: #f4f1ff; border-bottom: 3px solid #2a2050; }
  .card .pic { width: 104px; height: 104px; flex: none; background: #eef0f4; border: 2px solid #2a2050; overflow: hidden; display: flex; align-items: flex-end; justify-content: center; }
  .card .pic img { width: 100%; height: 100%; object-fit: cover; image-rendering: pixelated; }
  .card .pic canvas { image-rendering: pixelated; }
  .card h2 { margin: 2px 0 4px; font: 700 19px/1.1 "Silkscreen", monospace; }
  .card .role { color: #4b2fd6; font-weight: 600; }
  .card .bio { color: var(--muted); margin-top: 6px; font-size: 15px; }
  .card.anchored { right: auto; bottom: auto; max-width: none; max-height: calc(100vh - 24px); animation: card-pop .14s ease-out; transform-origin: top right; }
  @keyframes card-pop { from { opacity: 0; transform: scale(.94); } }
  .card .x { position: absolute; right: 10px; top: 10px; height: 28px; width: 28px; padding: 0; border: 2px solid #2a2050; border-radius: 0; background: #fff; box-shadow: inset -2px -2px 0 #e6e3f2; color: #2a2050; font: 700 15px/1 "Silkscreen", monospace; }
  .card .x:hover { background: #efeaff; color: #2a2050; border-color: #2a2050; }
  .card section { padding: 12px 16px; border-top: 2px solid #e6e3f2; }
  .card .top + section { border-top: 0; }
  .card h3 { margin: 0 0 8px; font: 700 13px "Silkscreen", monospace; letter-spacing: .04em; color: #2a2050; }
  .card dl { display: grid; grid-template-columns: 96px 1fr; gap: 4px 10px; margin: 0; }
  .card dt { color: var(--muted); }
  .card dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
  .card .chips { display: flex; flex-wrap: wrap; gap: 4px; }
  .card .chips span { background: #fff; border: 2px solid #2a2050; padding: 1px 6px; font: 700 11px/1.4 "Silkscreen", monospace; }
  .card .nums { display: flex; gap: 18px; margin-bottom: 8px; }
  .card .nums b { display: block; font: 700 21px "Silkscreen", monospace; }
  .card .nums small { color: var(--muted); }
  .card ol { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; }
  .card li { display: grid; grid-template-columns: 52px 1fr auto; gap: 8px; font-size: 15px; }
  .card li time { color: var(--muted); }
  .card li .bad { color: #dc2626; font-weight: 600; }
  .card li .ok { color: #16a34a; }
  .tabcol { position: relative; }
  .tabcol #status { position: absolute; left: 0; top: 44px; white-space: nowrap; }   /* computer name sits under the tabs */
  .tabs { display: flex; gap: 0; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
  .tabs button { height: 30px; border: 0; box-shadow: none; border-radius: 8px; font: 700 12px "Silkscreen", monospace; letter-spacing: .02em; }
  .tabs button.on { background: #2a2050; color: #fff; }
  body.not-office .office-only, body.not-office .side, body.not-office .legend, body.not-office .help { display: none !important; }
  .view { position: fixed; inset: 0; padding: 76px 24px 48px; overflow: auto; background: var(--bg); z-index: 2; }
  .view h1 { font: 700 26px "Silkscreen", monospace; margin: 4px 0 2px; letter-spacing: .02em; }
  .view .lead { color: var(--muted); margin: 0 0 18px; }
  .view h2 { font: 700 15px "Silkscreen", monospace; margin: 26px 0 4px; }
  .view h2.gt { font-size: 34px; margin-top: 38px; text-shadow: 4px 4px 0 var(--gs); }   /* The agents: big coloured group titles with a pixel drop shadow */
  .gt0 { color: #e2622b; --gs: #fbd9c7; }
  .gt1 { color: #7c3aed; --gs: #e2d6fd; }
  .gt2 { color: #0f9f6e; --gs: #c8efe0; }
  .gt3 { color: #2563eb; --gs: #d3e0fc; }
  .view .gblurb { color: var(--muted); margin: 0 0 12px; font-size: 13px; }
  .px { background: var(--card); border: 3px solid #2a2050; clip-path: polygon(3px 0, calc(100% - 3px) 0, calc(100% - 3px) 3px, 100% 3px, 100% calc(100% - 3px), calc(100% - 3px) calc(100% - 3px), calc(100% - 3px) 100%, 3px 100%, 3px calc(100% - 3px), 0 calc(100% - 3px), 0 3px, 3px 3px); box-shadow: inset -3px -3px 0 #e6e3f2; }
  .team { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
  .tcard { height: auto; cursor: pointer; display: flex; flex-direction: column; text-align: left; padding: 0; font: inherit; color: inherit; }
  .tcard:hover { box-shadow: inset -3px -3px 0 #d8d0ff; background: #fbfaff; }
  .tcard .stage { aspect-ratio: 1 / 1; background: #eef0f4; border-bottom: 3px solid #2a2050; position: relative; overflow: hidden; }
  .tcard .stage img { display: block; width: 100%; height: 100%; object-fit: cover; image-rendering: pixelated; }
  .tcard .live { position: absolute; left: 8px; top: 8px; display: flex; align-items: center; gap: 6px; background: #fff; border: 2px solid #2a2050; padding: 2px 7px; font: 700 10px "Silkscreen", monospace; }
  .tcard .live i { width: 8px; height: 8px; display: inline-block; }
  .tcard .tb { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 6px; }
  .tcard .tn { font: 700 18px "Silkscreen", monospace; }
  .tcard .tr { color: #4b2fd6; font-weight: 600; margin-top: -4px; }
  .tcard .bio { color: var(--muted); font-size: 13px; }
  .tcard .st { display: flex; gap: 16px; font-size: 12px; color: var(--muted); }
  .tcard .st b { color: var(--ink); font-size: 15px; margin-right: 3px; }
  .ptags { display: flex; flex-wrap: wrap; gap: 4px; }
  .ptags span { border: 2px solid #c9c4de; padding: 1px 6px; font-size: 12px; background: #f7f6fb; }
  .jump { display: flex; flex-wrap: wrap; gap: 10px; position: sticky; top: -16px; padding: 8px 0; background: var(--bg); z-index: 1; }
  .view::before { content: ''; position: fixed; left: 0; right: 0; top: 0; height: 64px; background: var(--bg); z-index: 1; }   /* the tabs sit on a solid strip, so scrolled content never shows behind them */
  .jump a { text-decoration: none; color: var(--ink); border: 2px solid #2a2050; background: #fff; padding: 8px 14px; font: 700 16px "Silkscreen", monospace; }
  .jump a:hover { background: #efeaff; }
  .skills { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
  .skill { padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
  .skill .sn { font: 700 14px "Silkscreen", monospace; overflow-wrap: anywhere; }
  .skill .sx { font-size: 13px; }
  .skill .su { font-size: 12px; color: var(--muted); margin-top: auto; }
  .skill .su b { color: #16a34a; }
  .skill.unused { box-shadow: none; border-color: #b9b4cf; }
  .skill.unused .sn { color: #5d6170; }
  /* skill group titles: bigger, one colour per group */
  #viewSkills h2 { font-size: 22px; margin-top: 32px; }
  .gc-design { --gc: #7c3aed; } .gc-qa { --gc: #db2777; } .gc-motion { --gc: #c2410c; } .gc-video { --gc: #dc2626; }
  .gc-ship { --gc: #15803d; } .gc-plan { --gc: #2563eb; } .gc-code { --gc: #0f766e; } .gc-setup { --gc: #a16207; }
  .gc-tools { --gc: #c026d3; } .gc-other { --gc: #5d6170; }
  #viewSkills h2 { color: var(--gc); }
  .skills .skill .sn { color: var(--gc); }   /* each skill name in its group's colour */
  /* Studio: a grid of every room; click one to redraw it in a new theme */
  .rgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
  .rcard { height: auto; padding: 0; display: flex; flex-direction: column; text-align: left; font: inherit; color: inherit; cursor: pointer; }
  .rcard:hover { box-shadow: inset -3px -3px 0 #d8d0ff; background: #fbfaff; }
  .rcard .stage { aspect-ratio: 8 / 7; background: #f4f5f8; border-bottom: 3px solid #2a2050; position: relative; display: flex; align-items: center; justify-content: center; }
  .rcard .stage img { width: 88%; height: 88%; object-fit: contain; image-rendering: pixelated; }
  .rcard .rn { padding: 10px 12px; font: 700 13px "Silkscreen", monospace; overflow-wrap: anywhere; }
  .rcard .flag { position: absolute; left: 8px; top: 8px; background: #fff; border: 2px solid #2a2050; padding: 2px 7px; font: 700 10px "Silkscreen", monospace; }
  .rcard .flag.ready { background: #fde68a; }
  .rcard .flag.error { background: #fecaca; }
  .agrid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
  .acard .stage { aspect-ratio: 1; }
  .rcard .as { display: block; margin-top: 4px; font: 400 15px/1.2 "Pixelify Sans", sans-serif; color: var(--muted); }
  #viewStudio .lead { font: 400 19px/1.4 "Pixelify Sans", sans-serif; }
  .sed .hint { font: 400 18px/1.35 "Pixelify Sans", sans-serif; color: var(--muted); margin: 0; }
  .rcard.on { background: #efeaff; }
  .cgrid { grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); }
  .cgrid .stage { aspect-ratio: 1; }
  .packrow { display: flex; gap: 8px; flex-wrap: wrap; }
  .packpick { height: auto; padding: 6px; display: flex; flex-direction: column; align-items: center; gap: 4px; width: 112px; border: 0; border-radius: 0; background: transparent; box-shadow: none; color: var(--ink); font: 600 11px "Silkscreen", monospace; cursor: pointer; }
  .packpick:hover { background: #f4f2fb; color: var(--ink); }
  .packpick img { width: 100%; image-rendering: pixelated; }
  .packpick.on { background: #efeaff; }
  .packpick.sel, .packpick.sel:hover { background: #ddd3ff; }
  .packrow .grpname { width: 100%; margin: 8px 0 0; font: 700 18px "Silkscreen", monospace; color: var(--muted); }
  .packrow.locked { opacity: .45; pointer-events: none; }
  .packacts:empty { display: none; }
  .sed-wrap { position: fixed; inset: 0; z-index: 6; background: rgba(28,29,34,.35); display: flex; align-items: center; justify-content: center; padding: 16px; }
  .sed-wrap[hidden] { display: none; }
  .sed .refrow { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .sed .refthumbs { display: contents; }
  .sed .refthumb { position: relative; width: 92px; height: 70px; }
  .sed .refthumb img { width: 100%; height: 100%; object-fit: cover; border: 2px solid #2a2050; }
  .sed .refx { position: absolute; top: -9px; right: -9px; width: 24px; height: 24px; padding: 0; border: 2px solid #2a2050; border-radius: 0; background: #fff; color: #2a2050; font: 700 13px/1 "Silkscreen", monospace; box-shadow: none; clip-path: none; cursor: pointer; }
  .sed .refx:hover { background: #efeaff; color: #2a2050; border-color: #2a2050; }
  .sed .refrow input[type=file] { display: none; }
  .sed .genbar.busy .pickref { display: none !important; }
  .sed .genbar { flex-basis: 100%; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  /* "Try as new user": the welcome card and the preview bar */
  .welcome { width: min(640px, 100%); gap: 4px; }
  .welcome .intro { color: var(--muted); margin: 2px 0 8px; font: 400 18px/1.35 "Pixelify Sans", sans-serif; }
  .welcome .step { border-top: 2px solid var(--line); padding: 14px 0 10px; display: flex; flex-direction: column; gap: 8px; }
  .welcome h3 { margin: 0; font: 700 24px "Silkscreen", monospace; color: #2a2050; }
  .welcome p { margin: 0; font: 400 17px/1.35 "Pixelify Sans", sans-serif; color: var(--muted); }
  .welcome a { color: #4b2fd6; font-weight: 600; }
  .welcome .row { display: flex; gap: 8px; }
  .welcome input[type=password] { flex: 1; min-width: 0; height: 36px; padding: 0 12px; border: 2px solid var(--line); border-radius: 8px; font: inherit; }
  .welcome input[type=password]:focus { outline: none; border-color: var(--accent); }
  .welcome .msg { font: 400 17px "Pixelify Sans", sans-serif; }
  .welcome .msg.ok { color: #15803d; } .welcome .msg.bad { color: #b91c1c; }
  .welcome .styles { display: flex; flex-wrap: wrap; gap: 6px; }
  .welcome .styles button { height: 32px; padding: 0 12px; }
  .welcome textarea { min-height: 64px; }
  .sed.hello { overflow-x: hidden; width: min(980px, 100%); align-items: center; text-align: center; padding: 44px 36px 40px; gap: 14px; }
  .sed.hello .hbox { width: fit-content; max-width: 100%; display: flex; flex-direction: column; align-items: stretch; gap: 14px; }   /* the title sets the content width: the agents never go past it */
  .sed.hello .logorow { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 6px; width: 100%; min-height: 142px; }   /* seven items, equal gaps */
  .sed.hello .cast { display: contents; }
  .sed.hello .cast canvas { image-rendering: pixelated; }
  .sed.hello .logo { width: 94px; height: 94px; image-rendering: pixelated; margin-bottom: 14px; }
  .sed.hello h1 { margin: 0; font: 700 clamp(30px, 5.4vw, 52px)/1.1 "Silkscreen", monospace; color: #2a2050; }
  .sed.hello p { font: 400 20px/1.4 "Pixelify Sans", sans-serif; max-width: 600px; margin: 0; }
  .sed.hello p.intro { margin: 8px 0 6px; font-size: 30px; line-height: 1.3; max-width: 780px; }
  .sed.hello .acts { justify-content: center; margin-top: 12px; }
  .sed.hello .acts .main { height: 58px; padding: 0 44px; font: 700 22px "Silkscreen", monospace; }
  @media (max-width: 700px) { .sed.hello h1 { font-size: 30px; } .sed.hello { padding: 32px 20px 28px; } .sed.hello .cast { display: none; } }
  .stbar { margin: 0 0 22px; }
  .keyblk { border: 2px solid var(--line); background: #fff; padding: 14px 16px; margin: 0 0 22px; display: flex; flex-direction: column; gap: 8px; max-width: 760px; }
  .keyblk .kt { font: 700 18px "Silkscreen", monospace; color: var(--muted); margin: 0; }

  .keyblk .kmsg { font: 400 17px "Pixelify Sans", sans-serif; }
  .keyblk .kmsg.ok { color: #15803d; } .keyblk .kmsg.bad { color: #b91c1c; }
  .stbar .main { background: #2a2050; color: #fff; border-color: #2a2050; box-shadow: inset -3px -3px 0 #3b2d70; }
  .stbar .main:hover { background: #3b2d70; color: #fff; }
  .freshbar { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 5; display: flex; align-items: center; gap: 8px; padding: 6px 6px 6px 14px; background: #2a2050; color: #fff; border-radius: 12px; box-shadow: 0 8px 24px rgba(28,29,34,.25); font: 700 12px "Silkscreen", monospace; white-space: nowrap; }
  .freshbar[hidden] { display: none; }
  .freshbar button { height: 30px; padding: 0 10px; font: 600 13px -apple-system, "Segoe UI", sans-serif; }
  @media (max-width: 700px) { .freshbar { bottom: auto; top: 8px; right: 12px; left: auto; transform: none; padding-left: 10px; } .freshbar span { display: none; } }
  .sed { position: relative; width: min(860px, 100%); max-height: calc(100vh - 32px); overflow: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
  .sed h2 { margin: 0; font: 700 30px "Silkscreen", monospace; padding-right: 48px; }
  .sed .x { position: absolute; right: 14px; top: 14px; height: 32px; width: 32px; padding: 0; border: 2px solid #2a2050; border-radius: 0; background: #fff; box-shadow: inset -2px -2px 0 #e6e3f2; color: #2a2050; font: 700 15px/1 "Silkscreen", monospace; }
  .sed .x:hover { background: #efeaff; color: #2a2050; border-color: #2a2050; }
  .sed.wide { width: min(1060px, 100%); }
  .sed .namefield { display: flex; flex-direction: column; gap: 6px; max-width: 460px; }
  .sed .namefield input { height: 42px; padding: 0 12px; border: 2px solid var(--line); border-radius: 8px; font: 16px -apple-system, "Segoe UI", sans-serif; color: var(--ink); background: #fff; }

// ───────── update ─────────
let last = performance.now();

requestAnimationFrame(tick);

// ───────── controls ─────────

// zoom menu: in / out / fixed sizes (100% = room art at its own pixel size)
const zoomBtn = document.getElementById('zoomBtn'), zoomMenu = document.getElementById('zoomMenu');
const showZoomMenu = open => { zoomMenu.hidden = !open; zoomBtn.setAttribute('aria-expanded', open); };

zoomMenu.onclick = e => {
  const b = e.target.closest('[data-zoom]'); if (!b) return;
  const v = b.dataset.zoom; stopFly();
  setZoom(v === 'in' ? zoomT * 1.3 : v === 'out' ? zoomT / 1.3 : +v);
  if (v !== 'in' && v !== 'out') showZoomMenu(false);   // in / out stay open for repeated clicks
};
document.getElementById('fit').onclick = () => fitAll(true);
pollLive().then(fitAll); setInterval(pollLive, 3000);
pollHistory(); setInterval(pollHistory, 60000);
canvas.addEventListener('wheel', e => { e.preventDefault(); stopFly(); setZoom(zoomT * Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0025)), { x: e.clientX, y: e.clientY }); }, { passive: false });
let topId = null;
function hitInfo(sx, sy) { for (const w of [...workers.values()].reverse()) { const r = w.infoHit; if (r && sx >= r.x && sx <= r.x + r.w && sy >= r.y && sy <= r.y + r.h) return w; } return null; }

function hitWorker(sx, sy) { for (const w of [...workers.values()].reverse()) for (const r of w.hit || []) if (sx >= r.x && sx <= r.x + r.w && sy >= r.y && sy <= r.y + r.h) return w; return null; }

canvas.addEventListener('pointerdown', e => { downAt = { x: e.clientX, y: e.clientY }; try { canvas.setPointerCapture(e.pointerId); } catch {} touches.set(e.pointerId, { x: e.clientX, y: e.clientY }); if (touches.size === 1) { drag = { x: e.clientX, y: e.clientY }; canvas.classList.add('dragging'); } else if (touches.size === 2) { const [a, b] = [...touches.values()]; pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), z: zoomT }; drag = null; } });

});
let lastTap = null;   // touch: two taps within 300 ms = a double click
const endPointer = e => { if (downAt && Math.hypot(e.clientX - downAt.x, e.clientY - downAt.y) < 4) {

canvas.addEventListener('pointerup', endPointer); canvas.addEventListener('pointercancel', endPointer);
// double click a room = zoom into it; the next double click = back to where you were
function roomUnder(sx, sy) {   // the room whose picture is under the pointer (its own pixels, front rooms first); a character counts for its room
  const w = hitWorker(sx, sy); if (w) return w.room;
  const p = toWorld({ x: sx, y: sy });
  for (const [name, r] of [...rooms.entries()].sort((a, b) => b[1].y - a[1].y)) {
    if (activeOnly && !r.active) continue;
    const im = roomImg(name); if (!im?.width) continue;
    const f = Math.min(room.width / im.width, room.height / im.height);
    const ix = Math.floor((p.x - r.x - (room.width - im.width * f) / 2) / f), iy = Math.floor((p.y - r.y - (room.height - im.height * f)) / f);

canvas.addEventListener('dblclick', e => { if (performance.now() - (lastTapZoom || 0) > 500) roomZoomToggle(e.clientX, e.clientY); });   // touch double taps are handled on pointerup

window.addEventListener('keydown', e => {

setView(location.hash.slice(1));      // open on the tab in the address (#agents / #skills)

window.officeDebug = () => [...workers.values()].map(w => ({ id: w.id, room: w.room, state: w.state, spot: w.spot, pos: [Math.round(w.pos.x), Math.round(w.pos.y)], path: w.path.map(p => [Math.round(p.x), Math.round(p.y)]) }));
